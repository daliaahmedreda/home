let currentLang = localStorage.getItem('siteLang') || 'en';
const params = new URLSearchParams(window.location.search);
const serviceId = params.get('id') || 'webDesign';

function applyLang() {
    const data = SERVICES[serviceId];
    const t = data[currentLang];
    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    document.title = t.title + ' — Dalia Ahmed Digital Agency';
    const mdesc = document.querySelector('meta[name="description"]');
    if (mdesc) mdesc.setAttribute('content', t.desc);
    document.getElementById('serviceTitle').textContent = t.title;
    document.getElementById('serviceDesc').textContent = t.desc;
    document.getElementById('contentBody').innerHTML = `
        <div class="grid md:grid-cols-2 gap-4 mb-8">
            ${t.features.map(f => `<div class="feature-item"><i data-lucide="check-circle-2" class="w-5 h-5" style="color:${data.color}"></i><span>${f}</span></div>`).join('')}
        </div>
        <div>${t.content}</div>`;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const map = { back: currentLang === 'ar' ? 'العودة إلى الخدمات' : 'Back to Services', badge: currentLang === 'ar' ? 'خدمتنا' : 'Our Service', ctaTitle: currentLang === 'ar' ? 'هل أنت مستعد للبدء؟' : 'Ready to Get Started?', ctaText: currentLang === 'ar' ? 'دعنا نحوّل احتياجاتك إلى واقع. تواصل معنا اليوم.' : "Let's bring your service needs to life. Get in touch with us today.", ctaWhatsapp: currentLang === 'ar' ? 'ابدأ مشروعك' : 'Start Your Project' };
        if (map[el.getAttribute('data-i18n')]) el.textContent = map[el.getAttribute('data-i18n')];
    });
    document.getElementById('langToggle').innerHTML = currentLang === 'ar' ? '<span>EN</span><i data-lucide="globe" class="w-4 h-4"></i>' : '<span>العربية</span><i data-lucide="globe" class="w-4 h-4"></i>';
    try { lucide.createIcons(); } catch(e) {}
}

document.getElementById('langToggle').addEventListener('click', () => {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    localStorage.setItem('siteLang', currentLang);
    applyLang();
});

applyLang();

// theme
const savedTheme = localStorage.getItem('siteTheme');
if (savedTheme === 'light') {
    document.documentElement.classList.remove('dark');
    document.documentElement.classList.add('light');
}

// scroll progress
window.addEventListener('scroll', () => {
    const st = window.scrollY;
    const dh = document.documentElement.scrollHeight - window.innerHeight;
    document.getElementById('scrollProgress').style.width = (dh > 0 ? (st / dh) * 100 : 0) + '%';
});
// mouse glow
document.addEventListener('mousemove', (e) => {
    document.getElementById('mouseGlow').style.left = e.clientX + 'px';
    document.getElementById('mouseGlow').style.top = e.clientY + 'px';
});
// loader
setTimeout(() => document.getElementById('loader').classList.add('hidden'), 600);
// reveal
const io = new IntersectionObserver((entries) => entries.forEach(en => { if (en.isIntersecting) en.target.classList.add('visible'); }), { threshold: 0.1 });
document.querySelectorAll('.fade-in-up').forEach(el => io.observe(el));
